name: CUDA smoke

# Self-hosted GPU runner CI for the Tyr GPU DSL. Catches regressions in the
# generated kernels and the dispatch glue. Runs on PRs that touch GPU code,
# plus manual `workflow_dispatch`.
#
# Setup notes (see dev/issues.md R1.3):
#   - Register a self-hosted runner with labels `[self-hosted, gpu]` against
#     the repo. Any GPU works for the CPU-side IR tests; for the parity tests
#     a CUDA-capable device is required and the runner host needs the
#     environment vars below set in `~/.bashrc` or a `.env` file:
#       GPU=GB10            (or H100, B200, etc. — see cc/Makefile)
#       TYR_GPU_FAMILY=BLACKWELL   (only needed on GB10 to override the default
#                                   HOPPER family for true Blackwell kernels)
#   - Pre-install: nvcc (CUDA 12.x or newer), python3 (for libtorch headers),
#     elan, libsoxr-dev. LibTorch is downloaded by the workflow per-run and
#     cached.
#   - The workflow opts in via the `gpu-ci` label on a PR so it doesn't block
#     CI when the runner is offline.

on:
  push:
    branches: [main]
    paths:
      - 'Tyr/GPU/**'
      - 'cc/src/tyr*'
      - 'cc/src/tk_*'
      - 'cc/src/generated/**'
      - 'cc/Makefile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/cuda-smoke.yml'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - 'Tyr/GPU/**'
      - 'cc/src/tyr*'
      - 'cc/src/tk_*'
      - 'cc/src/generated/**'
      - 'cc/Makefile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/cuda-smoke.yml'
  workflow_dispatch:

concurrency:
  group: cuda-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gpu-smoke:
    # Skip for unlabelled PRs so we don't block CI when the GPU runner is offline.
    # Maintainers add the `gpu-ci` label to opt a PR in.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    env:
      LIBTORCH_VERSION: 2.10.0
      # GPU defaults expected on the runner; override here if a runner
      # serves a different device.
      GPU: ${{ vars.TYR_GPU || 'GB10' }}
      TYR_GPU_FAMILY: ${{ vars.TYR_GPU_FAMILY || 'BLACKWELL' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: |
          git submodule update --init --depth 1 external/soxr
          git submodule update --init --depth 1 thirdparty/ThunderKittens

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan if missing
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Lean toolchain
        run: |
          toolchain="$(cat lean-toolchain)"
          # `elan toolchain install` errors with exit 1 when the toolchain
          # is already installed (which is normal on a long-lived
          # self-hosted runner). Skip the install in that case.
          if ! elan toolchain list | grep -q "^${toolchain}\b"; then
            elan toolchain install "${toolchain}"
          fi
          elan default "${toolchain}"

      - name: Set up LibTorch
        run: |
          mkdir -p external
          # Prefer a runner-host-provided libtorch if `TYR_LIBTORCH_DIR` is
          # set in repo vars (recommended for self-hosted GPU runners — the
          # full libtorch CUDA build with all headers is non-trivial to
          # download per-run, especially on aarch64 where there's no
          # canonical tarball).
          if [ -n "${{ vars.TYR_LIBTORCH_DIR }}" ] && [ -d "${{ vars.TYR_LIBTORCH_DIR }}" ]; then
            ln -sfn "${{ vars.TYR_LIBTORCH_DIR }}" external/libtorch
            echo "Using runner-provided libtorch at ${{ vars.TYR_LIBTORCH_DIR }}"
          elif [ "$(uname -m)" = "aarch64" ]; then
            # Fallback for aarch64: pip-install pytorch wheel. Note the
            # pip-installed wheel is missing some headers (e.g.
            # `c10/cuda/impl/cuda_cmake_macros.h`) so this fallback may not
            # be sufficient for full builds; prefer the
            # `vars.TYR_LIBTORCH_DIR` path for a real CUDA libtorch.
            python3 -m pip install --break-system-packages --target external/_torch_pip "torch==${LIBTORCH_VERSION}" 2>/dev/null || \
              python3 -m pip install --break-system-packages --target external/_torch_pip torch
            ln -sfn "$(realpath external/_torch_pip/torch)" external/libtorch
          else
            URL="https://download.pytorch.org/libtorch/cu124/libtorch-shared-with-deps-${LIBTORCH_VERSION}%2Bcu124.zip"
            curl --fail -L -o libtorch.zip "${URL}"
            unzip -q libtorch.zip -d external/
            rm libtorch.zip
          fi
          ls -la external/libtorch | head -3

      - name: Verify NVCC
        run: nvcc --version

      - name: Verify GPU
        run: nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader

      - name: Build GB10 E2E test runner
        env:
          # GB10 needs the Blackwell-family kernels emitted; the default
          # codegen module is the Hopper MhaH100 set which won't link the
          # `tkFlashAttnGb10*` / `tkFusedLayerNormResidual1024Blackwell*` /
          # `tkFusedRMSNormResidual1024Blackwell*` symbols the GB10 e2e
          # test invokes.
          TYR_GPU_CODEGEN_MODULE: 'Tyr.GPU.Kernels.MhaGB10 Tyr.GPU.Kernels.FusedRMSNorm Tyr.GPU.Kernels.FusedLayerNorm Tyr.GPU.Kernels.MhaH100Decode'
        run: |
          # Two-phase build to break the codegen circular dependency:
          # (1) Build the Lean .oleans for the kernel modules with
          #     codegen disabled — the codegen step needs .oleans for
          #     these modules, which on a fresh checkout don't exist yet.
          # (2) Re-run with codegen enabled — now the .oleans are present
          #     and codegen + libTyrC.a + the test exe build cleanly.
          TYR_SKIP_GPU_CODEGEN=1 lake -R build \
            Tyr.GPU.Kernels.MhaGB10 \
            Tyr.GPU.Kernels.FusedRMSNorm \
            Tyr.GPU.Kernels.FusedLayerNorm \
            Tyr.GPU.Kernels.MhaH100Decode
          lake -R build TestGPUGB10E2E

      - name: Run GB10 parity smoke
        env:
          TYR_GPU_CODEGEN_MODULE: 'Tyr.GPU.Kernels.MhaGB10 Tyr.GPU.Kernels.FusedRMSNorm Tyr.GPU.Kernels.FusedLayerNorm Tyr.GPU.Kernels.MhaH100Decode'
        run: |
          lake -R env ./.lake/build/bin/TestGPUGB10E2E --fail-fast

      - name: Optional — Hopper decode parity (only if Hopper hardware)
        if: env.GPU == 'H100'
        run: |
          lake -R build RunMhaH100Decode
          ./.lake/build/bin/RunMhaH100Decode --kv-seq 1024
